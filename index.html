<script>

edication interaction</b><small>Jose L. Â· Intake agent Â· high priority</small></div></div><div class="alert" onclick="render('revenue')"><i></i><div><b>2 claims missing attachments</b><small>Revenue agent Â· suggested next action ready</small></div></div><div class="alert" onclick="render('flow')"><i></i><div><b>Follow-up reminder due</b><small>3 patients Â· outreach agent Â· 14:00 batch</small></div></div>`)}</div>`}

Draft reminders only','0.91','Approval needed'],['Care plan agent','Suggest pathway steps','0.82','Ready']]);document.querySelector('#content').innerHTML=html;document.querySelector('#title').textContent=view==='home'?'Good morning, Dr. Reyes.':navItems.find(n=>n[0]===view)[1];}
function approve(b){b.textContent='Approved âœ“';b.disabled=true;b.style.opacity='.7';openModal('Approval recorded','Mock approval saved. No real clinical action was executed; all data is fictional demo content.')}function openModal(t,b){modalTitle.textContent=t;modalBody.textContent=b;modal.classList.add('show')}function closeModal(){modal.classList.remove('show')}render('home');

(()=>{const fix=(a,b)=>{const w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode())n.nodeValue=n.nodeValue.split(a).join(b)};const c=String.fromCharCode;fix(c(0xE2,0x153,0xA6),'*');fix(c(0xE2,0x152,0x2022),'Search');fix(c(0xC3,0x2014),'x');fix(c(0xE2,0x153,0x2713),'Approved');fix(c(0xE2,0x201A,0xB1),'PHP ');fix(c(0xE2,0x2014),'-');fix(c(0xC2,0xB7),' - ');})();
